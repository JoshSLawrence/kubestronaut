name: e2e

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Comma separated scenario ids; empty runs every scenario of every pack
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  matrix:
    # Runs only for dispatch, the weekly schedule, or PRs labelled "e2e".
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - id: ids
        env:
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          if [ -n "$INPUT_SCENARIOS" ]; then
            ids=$(printf '%s' "$INPUT_SCENARIOS" | jq -Rc 'split(",") | map(gsub("\\s"; "")) | map(select(length > 0))')
          else
            ids=$(go run ./cmd/kubestronaut list --json | jq -c 'map(.id)')
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    runs-on: ubuntu-24.04
    # Must exceed the longest validation.timeout (20m) plus about 10m for tool
    # install and kind node image pulls, otherwise the runner kills the test
    # before it can delete its cluster.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.matrix.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run e2e
        env:
          KS_E2E_SCENARIOS: ${{ matrix.id }}
          # Keeps go test's own timeout below the 40 minute job timeout so the
          # failure is reported by go test with its goroutine dump rather than
          # as a killed job. It does not guarantee cleanup: a go test timeout
          # panics the test binary without running t.Cleanup, so a cluster can
          # be left behind (it is discarded with the runner). validation.timeout
          # (at most 20m) ends a stuck scenario well before this limit and does
          # clean up.
          KS_E2E_TIMEOUT: 30m
