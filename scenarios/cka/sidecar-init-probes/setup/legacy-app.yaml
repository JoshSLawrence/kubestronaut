apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-app
  template:
    metadata:
      labels:
        app: legacy-app
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - 'n=0; while true; do n=$((n+1)); echo "legacy-app: tick $n" >> /var/log/legacy-app.log; sleep 2; done'
