apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: other
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, --http-port=8080, --udp-port=-1]
          ports:
            - containerPort: 8080
        - name: admin
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, --http-port=9090, --udp-port=-1]
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: backend
spec:
  selector:
    app: backend
  ports:
    - {name: api, port: 8080, targetPort: 8080}
    - {name: admin, port: 9090, targetPort: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: backend
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: frontend
  labels:
    app: frontend
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [pause]
---
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: frontend
  labels:
    app: debug
spec:
  containers:
    - name: debug
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [pause]
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: other
  labels:
    app: frontend
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [pause]
