apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-v1
  template:
    metadata:
      labels:
        app: api-v1
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [porter]
          env:
            - name: SERVE_PORT_8080
              value: v1
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-v2
  template:
    metadata:
      labels:
        app: api-v2
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [porter]
          env:
            - name: SERVE_PORT_8080
              value: v2
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-v1
  namespace: shop
spec:
  selector:
    app: api-v1
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-v2
  namespace: shop
spec:
  selector:
    app: api-v2
  ports:
    - port: 8080
