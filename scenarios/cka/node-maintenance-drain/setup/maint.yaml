apiVersion: v1
kind: Namespace
metadata:
  name: maint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: maint
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 2
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ['{{node "node01"}}']
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [pause]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: maint
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: maint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      terminationGracePeriodSeconds: 2
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ['{{node "node01"}}']
      containers:
        - name: cache
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [pause]
          volumeMounts:
            - name: scratch-space
              mountPath: /cache
      volumes:
        - name: scratch-space
          emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: maint
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: node-agent
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [pause]
---
apiVersion: v1
kind: Pod
metadata:
  name: scratch
  namespace: maint
  labels:
    app: scratch
spec:
  terminationGracePeriodSeconds: 2
  nodeName: '{{node "node01"}}'
  containers:
    - name: scratch
      image: busybox:1.38.0
      command: [sleep, 1d]
