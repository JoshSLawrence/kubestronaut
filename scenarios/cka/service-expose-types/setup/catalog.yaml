apiVersion: v1
kind: Namespace
metadata:
  name: catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        tier: web
    spec:
      containers:
        - name: catalog
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, --http-port=8080, --udp-port=-1]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /hostname, port: http}
            periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: canary
  namespace: catalog
  labels:
    app: canary
    tier: web
spec:
  containers:
    - name: canary
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [netexec, --http-port=8080, --udp-port=-1]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet: {path: /hostname, port: http}
        periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: catalog
  labels:
    app: client
spec:
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [pause]
