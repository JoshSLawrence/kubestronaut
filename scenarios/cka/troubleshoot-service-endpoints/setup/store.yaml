apiVersion: v1
kind: Namespace
metadata:
  name: store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: store
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        tier: checkout
    spec:
      containers:
        - name: checkout
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, --http-port=8080, --udp-port=-1]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: 8081
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-legacy
  namespace: store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-legacy
  template:
    metadata:
      labels:
        app: checkout-legacy
        tier: checkout
    spec:
      containers:
        - name: legacy
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, --http-port=8080, --udp-port=-1]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: 8080
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: store
spec:
  selector:
    app: checkout-svc
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: store
  labels:
    app: client
spec:
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [pause]
