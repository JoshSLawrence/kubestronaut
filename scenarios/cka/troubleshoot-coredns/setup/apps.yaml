apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: Pod
metadata:
  name: legacy
  namespace: apps
  labels:
    app: legacy
spec:
  containers:
    - name: legacy
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [netexec, --http-port=8080, --udp-port=-1]
---
apiVersion: v1
kind: Service
metadata:
  name: legacy
  namespace: apps
spec:
  selector:
    app: legacy
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: apps
  labels:
    app: client
spec:
  containers:
    - name: client
      image: busybox:1.38.0
      command: [sleep, 1d]
