apiVersion: kubestronaut/v1alpha1
kind: Scenario
metadata:
  name: networkpolicy-isolate
  title: Restrict access to an API with a NetworkPolicy
  domain: services-networking
  difficulty: medium
  tags: [networkpolicy]
spec:
  timeLimit: 10m
  weight: 6
  context: k8s-netpol
  namespaces: [shop, other]
  exclusive: false
  images:
    - registry.k8s.io/e2e-test-images/agnhost:2.61
  prompt: prompt.md
  hints:
    - A policy that selects a pod denies all ingress not explicitly allowed.
    - Combine podSelector and namespaceSelector carefully; `other` must stay
      blocked.
  setup:
    - manifest: setup/workloads.yaml
    - wait:
        ref: {kind: pod, namespace: shop, selector: app}
        for: condition=Ready
    - wait:
        ref: {kind: pod, namespace: other, selector: app}
        for: condition=Ready
  checks:
    - id: policy-exists
      description: NetworkPolicy shop/api-allow-web exists
      type: resourceExists
      ref: {kind: networkpolicy, name: api-allow-web, namespace: shop}
    - id: api-ready
      description: the api pods in shop are still running
      type: ready
      ref: {kind: pod, namespace: shop, selector: app=api}
    - id: web-allowed
      description: shop/web can reach api on 8080
      weight: 2
      type: connectivity
      from: {kind: pod, name: web, namespace: shop}
      to: api.shop.svc.cluster.local:8080
      expect: allowed
      retry: {attempts: 3, interval: 3s}
    - id: debug-still-reachable
      description: other workloads in shop keep accepting traffic
      weight: 2
      type: connectivity
      from: {kind: pod, name: intruder, namespace: other}
      to: debug.shop.svc.cluster.local:8080
      expect: allowed
      retry: {attempts: 3, interval: 3s}
    - id: debug-denied
      description: shop/debug cannot reach api
      weight: 2
      type: connectivity
      from: {kind: pod, name: debug, namespace: shop}
      to: api.shop.svc.cluster.local:8080
      expect: denied
      retry: {attempts: 3, interval: 3s}
    - id: other-denied
      description: pods in namespace other cannot reach api
      weight: 2
      type: connectivity
      from: {kind: pod, name: intruder, namespace: other}
      to: api.shop.svc.cluster.local:8080
      expect: denied
      retry: {attempts: 3, interval: 3s}
    - id: other-web-denied
      description: other/web, labelled like the real client, cannot reach api
      weight: 2
      type: connectivity
      from: {kind: pod, name: web, namespace: other}
      to: api.shop.svc.cluster.local:8080
      expect: denied
      retry: {attempts: 3, interval: 3s}
    - id: web-other-port-denied
      description: shop/web cannot reach api on any other port
      weight: 2
      type: connectivity
      from: {kind: pod, name: web, namespace: shop}
      to: api.shop.svc.cluster.local:8081
      expect: denied
      retry: {attempts: 3, interval: 3s}
  solution:
    script: solution/solve.sh
    readme: solution/README.md
  validation:
    passBeforeSolution: [api-ready, web-allowed, debug-still-reachable]
    timeout: 10m
