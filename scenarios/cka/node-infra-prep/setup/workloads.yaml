apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: infra
spec:
  selector:
    app: echo
  ports:
    - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: infra
  labels:
    app: probe
spec:
  nodeSelector:
    kubernetes.io/hostname: '{{node "node01"}}'
  containers:
    - name: probe
      image: busybox:1.38.0
      command: [sleep, "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: echo
  namespace: infra
  labels:
    app: echo
spec:
  nodeSelector:
    kubernetes.io/hostname: '{{node "controlplane"}}'
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: echo
      image: registry.k8s.io/e2e-test-images/agnhost:2.61
      args: [netexec, --http-port=8080, --udp-port=-1]
      ports:
        - containerPort: 8080
