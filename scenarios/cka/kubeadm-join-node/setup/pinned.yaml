apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinned
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinned
  template:
    metadata:
      labels:
        app: pinned
    spec:
      terminationGracePeriodSeconds: 2
      nodeSelector:
        kubernetes.io/hostname: '{{node "node01"}}'
      containers:
        - name: pinned
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [pause]
