# Third-party files copied into scenarios, pinned by sha256. `mise run vendor`
# downloads each url, checks it against the sha256 and writes it to every
# destination (relative to the repository root); a Go test checks that the
# copies still match. Fields are separated by whitespace:
#   name  version  sha256  url  destination...
# A url of the form render:<name> means the file is rendered by
# mise-tasks/vendor from the verified download of the entry <name>, which must
# be listed first; the sha256 is that of the rendered output.
