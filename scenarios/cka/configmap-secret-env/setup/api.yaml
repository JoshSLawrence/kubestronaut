apiVersion: v1
kind: Namespace
metadata:
  name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, --http-port=8080, --udp-port=-1]
          ports:
            - containerPort: 8080
