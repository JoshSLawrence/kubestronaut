apiVersion: kubestronaut/v1alpha1
kind: Scenario
metadata:
  name: ha-replace-control-plane
  title: Replace a failed control-plane member
  domain: cluster-architecture
  difficulty: hard
  tags: [kubeadm, etcd, ha, join, cluster-lifecycle]
spec:
  timeLimit: 20m
  weight: 8
  context: k8s-ha
  namespaces: [ops]
  exclusive: true
  cluster:
    controlPlanes: 3
    workers: 1
  images:
    - registry.k8s.io/e2e-test-images/agnhost:2.61
  prompt: prompt.md
  hints:
    - "`etcdctl member --help` lists what you can do with the members. etcdctl
      on the node needs the etcd endpoint and certificates, like the etcd
      snapshot commands do."
    - "`kubeadm init phase upload-certs --help` shows how a joining control
      plane gets the cluster certificates."
    - A kubeadm join for a control plane needs both a bootstrap token and the
      certificate key.
  setup:
    - manifest: setup/web.yaml
    - wait:
        ref: {kind: deployment, name: web, namespace: ops}
        for: condition=Available
    - script: setup/break.sh
      timeout: 5m
  checks:
    - id: cp03-ready
      description: node controlplane03 is Ready
      weight: 2
      type: ready
      ref: {kind: node, name: '{{node "controlplane03"}}'}
      retry: {attempts: 8, interval: 3s}
    - id: etcd-three-members
      description: etcd has exactly three members, one for each control-plane node, and every endpoint of the cluster is healthy
      weight: 4
      type: nodeExec
      node: controlplane
      shell: |
        export ETCDCTL_ENDPOINTS=https://127.0.0.1:2379 ETCDCTL_CACERT=/etc/kubernetes/pki/etcd/ca.crt
        export ETCDCTL_CERT=/etc/kubernetes/pki/etcd/server.crt ETCDCTL_KEY=/etc/kubernetes/pki/etcd/server.key
        members=$(etcdctl member list)
        test "$(printf '%s\n' "$members" | grep -c .)" = 3
        test "$(printf '%s\n' "$members" | grep -c ', started, ')" = 3
        for n in '{{node "controlplane"}}' '{{node "controlplane02"}}' '{{node "controlplane03"}}'; do
          printf '%s\n' "$members" | grep -q ", $n, " || exit 1
        done
        out=$(etcdctl endpoint health --cluster)
        test "$(printf '%s\n' "$out" | grep -c ' is healthy')" = 3
      retry: {attempts: 6, interval: 3s}
    - id: stale-member-gone
      description: the etcd member that belonged to the wiped node is no longer registered
      weight: 2
      type: script
      path: checks/stale-member-gone.sh
      retry: {attempts: 3, interval: 3s}
    - id: cp03-recreated
      description: controlplane03 registered with the cluster again
      type: script
      path: checks/cp03-recreated.sh
    - id: cp03-apiserver
      description: the API server pod of controlplane03 is ready
      type: ready
      ref: {kind: pod, name: 'kube-apiserver-{{node "controlplane03"}}', namespace: kube-system}
      retry: {attempts: 6, interval: 3s}
    - id: cp03-etcd
      description: the etcd pod of controlplane03 is ready
      type: ready
      ref: {kind: pod, name: 'etcd-{{node "controlplane03"}}', namespace: kube-system}
      retry: {attempts: 6, interval: 3s}
    - id: cp03-certs-new
      description: controlplane03 has serving certificates issued after it was wiped
      type: script
      path: checks/cp03-certs-new.sh
    - id: web-available
      description: deployment ops/web has 2 available replicas
      type: ready
      ref: {kind: deployment, name: web, namespace: ops}
      minReady: 2
      retry: {attempts: 6, interval: 3s}
  solution:
    script: solution/solve.sh
    readme: solution/README.md
  validation:
    passBeforeSolution: [web-available]
    timeout: 25m
