repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Vendored files must stay byte for byte as upstream published them: their
      # sha256 is pinned in scenarios/cka/vendor.lock.
      - id: trailing-whitespace
        exclude: ^scenarios/cka/(hpa-autoscale|monitor-resource-usage)/files/metrics-server\.yaml$|^scenarios/cka/kustomize-overlay/files/base/components\.yaml$|^scenarios/cka/crd-operator-cert-manager/files/cert-manager\.yaml$|^scenarios/cka/(ingress-traefik|gateway-httproute|gateway-migrate-ingress-tls)/files/traefik\.yaml$
      - id: end-of-file-fixer
        exclude: ^scenarios/cka/(hpa-autoscale|monitor-resource-usage)/files/metrics-server\.yaml$|^scenarios/cka/kustomize-overlay/files/base/components\.yaml$|^scenarios/cka/crd-operator-cert-manager/files/cert-manager\.yaml$
      # A chart's templates contain template syntax and are not valid YAML.
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^scenarios/.+/files/charts/[^/]+/templates/
      # The cert-manager manifest is about 1 MB; the default limit is 500 KB.
      - id: check-added-large-files
        exclude: ^scenarios/cka/(cni-install-calico/files/calico|crd-operator-cert-manager/files/cert-manager|gateway-httproute/files/gateway-api|gateway-migrate-ingress-tls/files/gateway-api)\.yaml$
  - repo: local
    hooks:
      # Calling mise keeps hook tool versions identical to CI.
      - id: lint-go
        name: lint go
        entry: mise run lint:go
        language: system
        types: [go]
        pass_filenames: false
      - id: lint-md
        name: lint markdown
        entry: mise run lint:md
        language: system
        types: [markdown]
        pass_filenames: false
      - id: lint-sh
        name: lint shell
        entry: mise run lint:sh
        language: system
        types: [shell]
        pass_filenames: false
      - id: test
        name: go test
        entry: mise run test
        language: system
        types: [go]
        pass_filenames: false
