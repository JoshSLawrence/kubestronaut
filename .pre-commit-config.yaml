repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Vendored files under a scenario's files/ must stay byte for byte as
      # upstream published them: their sha256 is pinned in vendor.lock, and a
      # chart's templates are not valid YAML.
      - id: trailing-whitespace
        exclude: ^scenarios/.+/files/
      - id: end-of-file-fixer
        exclude: ^scenarios/.+/files/
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^scenarios/.+/files/
      # The cert-manager manifest is about 1 MB.
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: local
    hooks:
      # Calling mise keeps hook tool versions identical to CI.
      - id: lint-go
        name: lint go
        entry: mise run lint:go
        language: system
        types: [go]
        pass_filenames: false
      - id: lint-md
        name: lint markdown
        entry: mise run lint:md
        language: system
        types: [markdown]
        pass_filenames: false
      - id: lint-sh
        name: lint shell
        entry: mise run lint:sh
        language: system
        types: [shell]
        pass_filenames: false
      - id: test
        name: go test
        entry: mise run test
        language: system
        types: [go]
        pass_filenames: false
